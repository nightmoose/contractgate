# Prometheus scrape configuration for DataContractGate (RFC-017).
#
# RFC-100: /metrics is fail-closed by default. The compose gateway sets
# METRICS_PUBLIC=1 so this scraper does not need a token. For a prod
# Prometheus (outside this compose stack), uncomment the `authorization`
# block below and configure `METRICS_AUTH_TOKEN` on the gateway.
#
# Metrics exposed:
#   contractgate_requests_total              (counter)
#   contractgate_validation_duration_seconds (histogram)
#   contractgate_violations_total            (counter)
#   contractgate_quarantined_total           (counter)
#   contractgate_contracts_active            (gauge)
#   contractgate_audit_log_rows              (gauge)

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: contractgate-gateway
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics
    # Uncomment and set if METRICS_AUTH_TOKEN is configured on the gateway:
    # authorization:
    #   credentials: <your-token-here>
