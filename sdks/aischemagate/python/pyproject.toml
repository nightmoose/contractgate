[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "aischemagate"
version = "0.5.0"
description = "AISchemaGate — LLM output validation on the DataContractGate engine, plus optional LangChain, LlamaIndex, and Instructor adapters."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NightMoose, Inc." }]
keywords = ["llm", "openai", "anthropic", "json-schema", "validation", "ai", "agent", "guardrails"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "contractgate>=0.4.0,<1.0",
]

[project.optional-dependencies]
langchain = [
  "langchain-core>=0.3,<2",
]
llamaindex = [
  "llama-index-core>=0.11,<1",
]
instructor = [
  "instructor>=1.6,<2",
  "pydantic>=2.4,<3",
]
dev = [
  "pytest>=8.0",
  "langchain-core>=0.3,<2",
  "llama-index-core>=0.11,<1",
  "instructor>=1.6,<2",
  "pydantic>=2.4,<3",
]

[project.urls]
Homepage = "https://aischemagate.com"
Documentation = "https://aischemagate.dev"
Source = "https://github.com/nightmoose/contractgate"

[tool.hatch.build.targets.wheel]
packages = ["src/aischemagate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
