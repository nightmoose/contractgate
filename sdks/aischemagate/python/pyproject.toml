[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "aischemagate"
version = "0.1.0"
description = "AISchemaGate — thin alias over `contractgate` for LLM output validation. Same engine as DataContractGate."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NightMoose, Inc." }]
keywords = ["llm", "openai", "anthropic", "json-schema", "validation", "ai", "agent", "guardrails"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "contractgate>=0.3.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://aischemagate.com"
Documentation = "https://aischemagate.dev"
Source = "https://github.com/nightmoose/contractgate"

[tool.hatch.build.targets.wheel]
packages = ["src/aischemagate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
