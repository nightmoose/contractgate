# Smithery discovery for the DataContractGate and AISchemaGate MCP server.
# The official registry listing is mcp/server.json.
# contractgateBaseUrl is the API gateway, not the dashboard host.
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - contractgateApiKey
    properties:
      contractgateApiKey:
        type: string
        description: DataContractGate API key (cg_live_...)
      contractgateBaseUrl:
        type: string
        description: Gateway base URL
        default: https://api.datacontractgate.com
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@nightmoose/contractgate-mcp-server"],
      env: {
        CONTRACTGATE_API_KEY: config.contractgateApiKey,
        ...(config.contractgateBaseUrl
          ? { CONTRACTGATE_BASE_URL: config.contractgateBaseUrl }
          : {})
      }
    })
