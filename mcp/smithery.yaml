# AISchemaGate validates structured LLM output against a contract and returns
# the violation fields used for repair, plus DataContractGate data contracts.
# Install manifest for Smithery. The registry listing is mcp/server.json.
# contractgateBaseUrl is the API gateway, not the dashboard host.
startCommand:
  type: stdio
  configSchema:
    type: object
    description: AISchemaGate validates structured LLM output against a contract and returns the violation fields used for repair, plus DataContractGate data contracts.
    required:
      - contractgateApiKey
    properties:
      contractgateApiKey:
        type: string
        description: API key for AISchemaGate and DataContractGate (cg_live_...)
      contractgateBaseUrl:
        type: string
        description: Gateway base URL for AISchemaGate and DataContractGate
        default: https://api.datacontractgate.com
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@nightmoose/contractgate-mcp-server"],
      env: {
        CONTRACTGATE_API_KEY: config.contractgateApiKey,
        ...(config.contractgateBaseUrl
          ? { CONTRACTGATE_BASE_URL: config.contractgateBaseUrl }
          : {})
      }
    })
