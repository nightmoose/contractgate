# Real login stack. Use with the base file:
#
#   cp .env.selfhost.example .env
#   docker compose -f docker-compose.yml -f docker-compose.selfhost.yml up --build
#
# Do not add --profile demo. That profile is the zero-auth dashboard and
# binds the same host port. `make demo` does not load this file.
#
# Placeholders in .env.selfhost.example are for a private machine. Change
# the JWT secret and regenerate the two keys before any other host can
# reach this stack. The authenticator and supabase_auth_admin database
# passwords are the local placeholders in ops/postgres/selfhost-roles.sql.

services:
  postgres:
    environment:
      CONTRACTGATE_SELF_HOST: "1"
    volumes:
      - ./ops/postgres/selfhost-roles.sql:/selfhost/roles.sql:ro

  auth:
    image: supabase/gotrue:v2.180.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:8000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:supabase_auth_admin@postgres:5432/contractgate
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/confirm
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/reset
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  selfhost-migrate:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: cg
      PGPASSWORD: cg
      PGDATABASE: contractgate
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./ops/postgres/selfhost-grants.sql:/selfhost/grants.sql:ro
      - ./ops/postgres/selfhost-apply.sh:/selfhost-apply.sh:ro
    entrypoint: ["/bin/sh", "/selfhost-apply.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started
    restart: "no"

  rest:
    image: postgrest/postgrest:v12.2.12
    environment:
      PGRST_DB_URI: postgres://authenticator:authenticator@postgres:5432/contractgate
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
    depends_on:
      selfhost-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./ops/api/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth
      - rest
    restart: unless-stopped

  gateway:
    image: contractgate-gateway:selfhost
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CONTRACTGATE_DEV_NO_AUTH: "0"
      CONTRACTGATE_SELF_HOSTED: "true"
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      selfhost-migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_DEMO_MODE: "0"
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_API_KEY: ""
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:8000
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: 0.0.0.0
      SUPABASE_SERVER_URL: http://api:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    depends_on:
      gateway:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped
