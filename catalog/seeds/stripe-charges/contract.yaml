version: "1.0"
name: "stripe-charges"
description: "Stripe Charge object — core fields of an exported Stripe charge. Compatible with Stripe's API Charge object; not affiliated with Stripe."

ontology:
  entities:
    - name: id
      type: string
      required: true
      pattern: "^ch_[A-Za-z0-9]+$"
    - name: object
      type: string
      required: true
      enum: ["charge"]
    - name: amount
      type: integer
      required: true
      min: 0
    - name: amount_captured
      type: integer
      required: false
      min: 0
    - name: amount_refunded
      type: integer
      required: false
      min: 0
    - name: currency
      type: string
      required: true
      pattern: "^[a-z]{3}$"
    - name: customer
      type: string
      required: false
      pattern: "^cus_[A-Za-z0-9]+$"
    - name: description
      type: string
      required: false
    - name: paid
      type: boolean
      required: true
    - name: refunded
      type: boolean
      required: true
    - name: captured
      type: boolean
      required: false
    - name: status
      type: string
      required: true
      enum: ["succeeded", "pending", "failed"]
    - name: created
      type: integer
      required: true
      min: 0
    - name: livemode
      type: boolean
      required: false
    - name: receipt_email
      type: string
      required: false
      format: email
    - name: payment_intent
      type: string
      required: false
      pattern: "^pi_[A-Za-z0-9]+$"

glossary:
  - field: amount
    description: "Amount intended to be collected, in the smallest currency unit (e.g. cents)."
    constraints: "non-negative integer"
  - field: currency
    description: "Three-letter ISO currency code, lowercase."
    constraints: "ISO 4217, lowercase"
  - field: status
    description: "The status of the payment."
    constraints: "one of succeeded, pending, failed"
  - field: created
    description: "Time at which the object was created (Unix epoch seconds)."
    constraints: "non-negative integer"
