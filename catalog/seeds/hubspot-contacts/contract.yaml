version: "1.0"
name: "hubspot-contacts"
description: "HubSpot CRM contact — default properties from the Contacts API / export. Compatible with HubSpot's documented default contact properties; not affiliated with HubSpot. Lifecycle stages listed here are the defaults; newer accounts can define their own."

ontology:
  entities:
    - name: id
      type: string
      required: true
      pattern: "^[0-9]+$"
    - name: email
      type: string
      required: false
      format: email
    - name: firstname
      type: string
      required: false
    - name: lastname
      type: string
      required: false
    - name: phone
      type: string
      required: false
    - name: company
      type: string
      required: false
    - name: lifecyclestage
      type: string
      required: false
      enum:
        - "subscriber"
        - "lead"
        - "marketingqualifiedlead"
        - "salesqualifiedlead"
        - "opportunity"
        - "customer"
        - "evangelist"
        - "other"
    - name: hs_object_id
      type: string
      required: false
      pattern: "^[0-9]+$"
    - name: createdate
      type: timestamp
      required: false
    - name: lastmodifieddate
      type: timestamp
      required: false

glossary:
  - field: id
    description: "HubSpot record id for the contact."
    constraints: "numeric string"
  - field: lifecyclestage
    description: "The contact's stage in the marketing/sales lifecycle. The allowed values are HubSpot's default stages. Newer accounts can define their own stages; those values will not match until this list is edited."
    constraints: "HubSpot default lifecycle stage value"
  - field: createdate
    description: "Timestamp when the contact was created."
    constraints: "RFC 3339 timestamp"
