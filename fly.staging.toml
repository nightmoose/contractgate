# Staging API Fly app. Deployed from the `staging` branch; scales to zero when
# idle. CI deploys it on push to `staging`.
#
#   fly apps create <staging-app>                     # maintainer, once
#   fly secrets set -a <staging-app> DATABASE_URL=...
#   fly deploy -c fly.staging.toml
#
# Never put Stripe live keys, Confluent or AWS secrets on staging.

app = 'contractgate-api-staging'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3001'
  RUST_LOG = 'contractgate=debug,tower_http=info'
  # Confluent Cloud is closed; no Kafka consumers on staging either.
  KAFKA_ENABLED = 'false'
  # Staging must set CANONICAL_API_ORIGIN=https://contractgate-api-staging.fly.dev

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

[checks]
  [checks.ready]
    port = 3001
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/ready'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
