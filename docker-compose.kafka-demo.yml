# Self-contained Kafka transport for the DataContractGate speed demo.
#
# Apache Kafka 4.x in KRaft mode. The native client uses the KIP-848
# consumer group protocol, which this broker provides. Redpanda 24.x does
# not. Bring it up before running `cargo run --features demo --bin demo`:
#
#     docker compose -f docker-compose.kafka-demo.yml up -d
#
# The demo connects to `127.0.0.1:9092` by default. Shut it down with
# `docker compose -f docker-compose.kafka-demo.yml down`.
#
# NOTE: this file was renamed from `docker-compose.yml` (2026-04-28) when
# RFC-017 introduced the full gateway stack at `docker-compose.yml`.

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: contractgate-kafka
    # Two client listeners:
    #  - EXTERNAL on :9092 advertises 127.0.0.1:9092 for the demo on the host.
    #  - INTERNAL on :29092 advertises kafka:29092 for other containers.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
