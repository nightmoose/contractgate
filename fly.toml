# fly.toml app configuration file generated for contractgate-api on 2026-04-14T15:52:37-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'contractgate-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3001'
  RUST_LOG = 'contractgate=info,tower_http=warn'
  # Confluent Cloud account closed 2026-10-14: no Kafka consumers. Set to
  # 'true' only with a working broker + CONFLUENT_* secrets.
  KAFKA_ENABLED = 'false'
  # RFC-050: DASHBOARD_ORIGIN is intentionally NOT set here — it contains the
  # production origins and must be injected via fly secrets so it is never
  # committed to source control. Prod carries three origins per RFC-096
  # (one backend, two front doors):
  # fly secrets set DASHBOARD_ORIGIN=https://app.datacontractgate.com,https://aischemagate.com,https://aischemagate.dev
  # Production must set CANONICAL_API_ORIGIN=https://api.datacontractgate.com
  #
  # DATABASE_URL (set via `fly secrets`, never here) MUST use the Supabase
  # pooler host (*.pooler.supabase.com), never the direct host
  # (db.<project>.supabase.co). The direct host opens one Postgres backend per
  # connection and cannot absorb a spike; the server logs a startup warning if
  # it sees the direct host.
  #
  # DB pool size per machine is CONTRACTGATE_DB_POOL_MAX_CONNECTIONS (default
  # 10, src/request_limits.rs). `pool size * min_machines_running` is the
  # steady-state connection count and MUST stay under the Supabase pooler's
  # connection limit. Today: 10 * 2 = 20. Raise the pool and the machine count
  # together, and check the pooler limit before scaling past it (see
  # docs/ops/spike-day-runbook.md).

[http_service]
  internal_port = 3001
  force_https = true
  # Always-on for the spike: keep machines up so the first Show HN burst does
  # not pay a cold-start. auto_start still brings a stopped machine back if one
  # ever exits.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    # PLACEHOLDER pending staging load test (ops/loadtest/spike.js). These are
    # the pre-spike values, not yet validated against performance-1x + the
    # pool size above; tune from the staging run before the event.
    type = 'requests'
    hard_limit = 500
    soft_limit = 400

  # Service check: a non-2xx on /ready stops routing to this machine.
  # One failure does not restart it. The process exits after three
  # consecutive failures; [[restart]] below brings the machine back.
  # timeout is above the handler's 2s SELECT 1 so a slow probe returns
  # 503 instead of the check itself timing out. grace_period covers boot.
  [[http_service.checks]]
    grace_period = '30s'
    interval = '15s'
    timeout = '5s'
    method = 'GET'
    path = '/ready'

[checks]
  # Same probe, for `fly checks list`. Top-level checks do not route or
  # restart; the service check and [[restart]] do.
  [checks.ready]
    port = 3001
    type = 'http'
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/ready'

# on-failure restarts a non-zero exit (the wedged-pool exit). Kept at
# on-failure (not `always`) so it stays correct if auto_stop is ever turned
# back on; with auto_stop_machines = 'off' the machines do not stop anyway.
[[restart]]
  policy = 'on-failure'
  retries = 10

[[vm]]
  # performance-1x for the spike: a dedicated CPU holds p99 under load where a
  # shared CPU would be throttled. 2048 MB gives headroom for the pool and
  # per-request buffers; drop to 1024 if cost matters and the staging load test
  # shows memory stays well under it.
  cpu_kind = 'performance'
  cpus = 1
  memory_mb = 2048
