# Runs the schema-drift example end to end: contractgate CLI, dbt-duckdb
# manifest, and the review-only draft. No warehouse account and no API key.
name: Schema drift agent

on:
  pull_request:
    branches: [staging, main]
    paths:
      - "examples/schema-drift-agent/**"
      - ".github/workflows/schema-drift-agent.yml"
      - "src/cli/commands/test.rs"
      - "src/bin/contractgate.rs"
      - "src/validation.rs"
      - "src/contract.rs"
  push:
    branches: [staging, main]
    paths:
      - "examples/schema-drift-agent/**"
      - ".github/workflows/schema-drift-agent.yml"
      - "src/cli/commands/test.rs"
      - "src/bin/contractgate.rs"
      - "src/validation.rs"
      - "src/contract.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-drift-agent-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  DO_NOT_TRACK: "1"

jobs:
  demo:
    name: schema-drift-agent demo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Match the main CI install. `rust-toolchain.toml` then selects 1.98.0.
      # Pinning 1.98.0 here without clippy/rustfmt makes the later `cargo build`
      # try to add those components and fail with a cargo-fmt proxy conflict.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-schema-drift-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-schema-drift-
            ${{ runner.os }}-cargo-

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: examples/schema-drift-agent/requirements.txt

      - name: Run the demo
        working-directory: examples/schema-drift-agent
        run: make demo
