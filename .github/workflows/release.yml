# ContractGate Release Workflow
#
# Triggered by: tag push matching v*.*.* OR manual workflow_dispatch.
#
# Jobs:
#   version-check     — asserts Cargo.toml version == tag; exports VERSION
#   build-cli         — cross-compiles CLI for 4 targets, uploads tarballs
#   publish-release   — assembles GitHub Release
#   publish-npm-*     — MCP server + TypeScript SDK to npm (OIDC Trusted Publisher)
#   publish-mcp-registry — mcp/server.json to the official MCP Registry
#   publish-pypi      — publishes Python SDK to TestPyPI (always) + PyPI
#
# Every publish step is idempotent: a version already on the registry is
# skipped, not failed. To retry a partially-failed release, dispatch this
# workflow with the existing tag — no re-tagging needed. Dispatch builds and
# publishes the code AT THE TAG (RELEASE_REF), using this file's workflow logic.
#
# Non-goals for v0.1:
#   No Windows targets.
#   No code-signing / notarization.
#   No Homebrew tap.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Semver tag to build (e.g. v0.1.0). Must match Cargo.toml version.'
        required: true

env:
  CARGO_TERM_COLOR: always
  # Tag push → refs/tags/vX.Y.Z; dispatch → the tag given as input.
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Version gate ────────────────────────────────────────────────────────
  # Fails fast if the pushed tag doesn't match [package].version in Cargo.toml.
  # Exports `version` (stripped of leading `v`) for downstream jobs.
  version-check:
    name: Version check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Resolve tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Assert Cargo.toml version matches tag
        id: check
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          TAG_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "Tag version  : ${TAG_VERSION}"
          echo "Cargo version: ${CARGO_VERSION}"
          if [[ "${TAG_VERSION}" != "${CARGO_VERSION}" ]]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${CARGO_VERSION}."
            echo "Bump [package].version in Cargo.toml and sdks/python/pyproject.toml, then re-tag."
            exit 1
          fi
          echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

  # ── 2. CLI cross-compile + tarball ─────────────────────────────────────────
  # Builds the `contractgate` binary for each target and packages it as:
  #   contractgate-<VERSION>-<TARGET>.tar.gz
  # Contents: contractgate (binary), LICENSE, README.md
  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: version-check
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest   # macos-13 (Intel) is retired; cross-compiles from arm64
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins the channel, so the target installed above
      # lands on `stable`, not the pinned toolchain. Add it to the pinned one.
      - name: Add target to pinned toolchain
        if: matrix.cross != true
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (Linux ARM64 only)
        if: matrix.cross == true
        # Pin to a release tag — `--git` would silently track main and risk
        # breaking the release pipeline on upstream changes.
        run: cargo install cross --version 0.2.5 --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: release-${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build CLI (cross — Linux ARM64)
        if: matrix.cross == true
        run: cross build --release --bin contractgate --target ${{ matrix.target }}
        env:
          SQLX_OFFLINE: "true"

      - name: Build CLI (native)
        if: matrix.cross != true
        run: cargo build --release --bin contractgate --target ${{ matrix.target }}
        env:
          SQLX_OFFLINE: "true"

      - name: Package tarball
        run: |
          VERSION="${{ needs.version-check.outputs.version }}"
          TARGET="${{ matrix.target }}"
          TARBALL="contractgate-${VERSION}-${TARGET}.tar.gz"
          cp "target/${TARGET}/release/contractgate" contractgate
          tar czf "${TARBALL}" contractgate LICENSE README.md
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: contractgate-${{ needs.version-check.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # ── 3. Publish GitHub Release ──────────────────────────────────────────────
  # Downloads all four tarballs, generates SHA256SUMS, creates a GitHub Release
  # with auto-generated release notes. Runs on tag pushes only.
  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [version-check, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Download all tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist/

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: List release assets
        run: ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.version-check.outputs.version }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists — replacing assets."
            gh release upload "${TAG}" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "${TAG}" dist/*.tar.gz dist/SHA256SUMS \
              --verify-tag \
              --title "ContractGate ${TAG}" \
              --generate-notes
          fi

  # ── 4. Publish MCP npm package ────────────────────────────────────────────
  # Publishes @nightmoose/contractgate-mcp-server to npm. Must complete before
  # the MCP registry publish (step 5) because the registry validates the npm
  # package exists at the declared version before accepting server.json.
  # (@contractgate/mcp-server is the deprecated pre-0.2.0 name.)
  #
  # Authentication: npm Trusted Publisher (OIDC) — no stored token required.
  # One-time setup on npmjs.com: @nightmoose/contractgate-mcp-server →
  #   Settings → Trusted Publishers → Add: GitHub, owner=nightmoose,
  #   repo=contractgate, workflow=release.yml
  publish-npm-mcp:
    name: Publish MCP npm package
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm OIDC Trusted Publisher
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Assert mcp/package.json version matches tag
        run: |
          MCP_VERSION=$(node -p "require('./mcp/package.json').version")
          TAG_VERSION="${{ needs.version-check.outputs.version }}"
          echo "mcp/package.json : ${MCP_VERSION}"
          echo "Tag version      : ${TAG_VERSION}"
          if [[ "${MCP_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::mcp/package.json version ${MCP_VERSION} != tag ${TAG_VERSION}. Bump it before tagging."
            exit 1
          fi
      - name: Skip if version already on npm
        id: exists
        working-directory: mcp
        run: |
          SPEC="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          if npm view "${SPEC}" version >/dev/null 2>&1; then
            echo "::notice::${SPEC} already published — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.exists.outputs.skip != 'true'
        working-directory: mcp
        run: npm ci
      - name: Publish to npm (OIDC provenance)
        if: steps.exists.outputs.skip != 'true'
        working-directory: mcp
        run: npm publish --provenance --access public

  # ── 5. Publish to MCP Registry ────────────────────────────────────────────
  # Runs after npm publish so the registry can verify the npm package
  # exists at the declared version. Uses GitHub OIDC (no stored secret needed).
  publish-mcp-registry:
    name: Publish to MCP Registry
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: publish-npm-mcp
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Install mcp-publisher
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Login (GitHub OIDC) and publish
        run: |
          NAME=$(jq -r .name mcp/server.json)
          VERSION=$(jq -r .version mcp/server.json)
          if curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=${NAME}" \
              | jq -e --arg n "$NAME" --arg v "$VERSION" \
                  '.servers[] | select(.server.name==$n and .server.version==$v)' >/dev/null; then
            echo "::notice::${NAME}@${VERSION} already in the MCP Registry — skipping."
            exit 0
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish mcp/server.json

  # ── 6. Publish TypeScript SDK ─────────────────────────────────────────────
  # Publishes @nightmoose/contractgate-sdk to npm on tag pushes.
  #
  # Authentication: npm Trusted Publisher (OIDC) — no stored token required.
  # npm only allows a Trusted Publisher on a package that already exists, so
  # the very first version must be published by hand (`npm publish` locally).
  # Then on npmjs.com: @nightmoose/contractgate-sdk →
  #   Settings → Trusted Publishers → Add: GitHub, owner=nightmoose,
  #   repo=contractgate, workflow=release.yml
  publish-npm-sdk-ts:
    name: Publish TypeScript SDK
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm OIDC Trusted Publisher
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Assert sdks/typescript/package.json version matches tag
        run: |
          SDK_VERSION=$(node -p "require('./sdks/typescript/package.json').version")
          TAG_VERSION="${{ needs.version-check.outputs.version }}"
          echo "sdks/typescript/package.json : ${SDK_VERSION}"
          echo "Tag version                  : ${TAG_VERSION}"
          if [[ "${SDK_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::TypeScript SDK version ${SDK_VERSION} != tag ${TAG_VERSION}. Bump it before tagging."
            exit 1
          fi
      - name: Skip if version already on npm
        id: exists
        working-directory: sdks/typescript
        run: |
          SPEC="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          if npm view "${SPEC}" version >/dev/null 2>&1; then
            echo "::notice::${SPEC} already published — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.exists.outputs.skip != 'true'
        working-directory: sdks/typescript
        run: npm ci
      - name: Publish to npm (OIDC provenance)
        if: steps.exists.outputs.skip != 'true'
        working-directory: sdks/typescript
        run: npm publish --provenance --access public

  # ── 7. Publish Python SDK ──────────────────────────────────────────────────
  # Publishes contractgate Python SDK (sdks/python/).
  # Always publishes to TestPyPI for smoke-test visibility.
  # Publishes to PyPI on tag pushes / dispatch (via OIDC Trusted Publisher).
  #
  # One-time setup required:
  #   - PyPI:     project `contractgate` → Publishing → Add GitHub publisher:
  #               owner=nightmoose, repo=contractgate, workflow=release.yml,
  #               environment=pypi. Every claim must match exactly, or PyPI
  #               returns `invalid-publisher`. (The `pypi` GitHub environment
  #               has no protection rules, so it does not gate the job.)
  #   - TestPyPI: Store TEST_PYPI_API_TOKEN in repository secrets
  #               (OIDC support on TestPyPI incomplete as of 2026-04)
  publish-pypi:
    name: Publish Python SDK
    needs: version-check
    runs-on: ubuntu-latest
    environment: pypi   # part of the Trusted Publisher claim — keep in sync with PyPI
    permissions:
      id-token: write   # required for PyPI OIDC Trusted Publisher
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Assert pyproject.toml version matches tag
        run: |
          SDK_VERSION=$(grep -m1 '^version' sdks/python/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${{ needs.version-check.outputs.version }}"
          echo "SDK pyproject.toml: ${SDK_VERSION}"
          echo "Tag version       : ${TAG_VERSION}"
          if [[ "${SDK_VERSION}" != "${TAG_VERSION}" ]]; then
            echo "::error::SDK version ${SDK_VERSION} != tag ${TAG_VERSION}."
            echo "Bump version in sdks/python/pyproject.toml to match Cargo.toml."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build
        run: pip install build

      - name: Build sdist + wheel
        working-directory: sdks/python
        run: python -m build

      - name: Publish to TestPyPI (smoke-test — always)
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: sdks/python/dist/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

      - name: Publish to PyPI (tags only — OIDC Trusted Publisher)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist/
          skip-existing: true
          # No `password` field — authentication via id-token OIDC grant above.
