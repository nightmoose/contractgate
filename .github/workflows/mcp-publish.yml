# Publish mcp/server.json to the official MCP Registry.
# Uses GitHub OIDC (io.github.nightmoose/* namespace). Dispatch after a
# version bump in server.json; do not republish the same version.
name: mcp-publish

on:
  # Manual only — the release workflow (release.yml) handles the normal
  # tag-driven publish sequence: npm first, then MCP registry.
  # Use this dispatch for emergency re-publishes without a new tag.
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Login (GitHub OIDC) and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish mcp/server.json
