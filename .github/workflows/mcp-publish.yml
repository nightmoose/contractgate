# Publish mcp/server.json to the official MCP Registry.
# Uses GitHub OIDC (io.github.nightmoose/* namespace). Dispatch after a
# version bump in server.json; do not republish the same version.
name: mcp-publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - mcp/server.json

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Login (GitHub OIDC) and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish mcp/server.json
