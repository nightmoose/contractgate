name: "DataContractGate Validate"
description: "Parse and compile DataContractGate YAML contracts. Local, no network, no CLI tarball."
author: "DataContractGate"
branding:
  icon: shield
  color: green

inputs:
  path:
    description: "Directory of contract YAML files (recursive **/*.{yaml,yml})."
    required: false
    default: "contracts"
  python-version:
    description: "Python version for the validator venv."
    required: false
    default: "3.12"
  allow-empty:
    description: "If true, succeed when the path has no YAML files."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install contractgate SDK
      shell: bash
      run: python -m pip install --quiet "contractgate>=0.1.0"

    - name: Compile contracts
      shell: bash
      env:
        ALLOW_EMPTY: ${{ inputs.allow-empty }}
        CONTRACT_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        extra=()
        if [ "$ALLOW_EMPTY" = "true" ]; then
          extra+=(--allow-empty)
        fi
        python "${{ github.action_path }}/../../contractgate_hooks/validate.py" \
          --dir "$CONTRACT_PATH" \
          "${extra[@]}"
