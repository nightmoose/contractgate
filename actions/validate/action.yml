name: "ContractGate Validate"
description: "Parse and compile ContractGate YAML contracts. Local, no network, no CLI tarball."
author: "DataContractGate"
branding:
  icon: shield
  color: green

inputs:
  path:
    description: "Directory of contract YAML files (recursive **/*.{yaml,yml})."
    required: false
    default: "contracts"
  python-version:
    description: "Python version for the validator venv."
    required: false
    default: "3.12"
  allow-empty:
    description: "If true, succeed when the path has no YAML files."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install contractgate SDK
      shell: bash
      run: python -m pip install --quiet "contractgate>=0.1.0"

    - name: Compile contracts
      shell: bash
      run: |
        set -euo pipefail
        extra=()
        if [ "${{ inputs.allow-empty }}" = "true" ]; then
          extra+=(--allow-empty)
        fi
        python "${{ github.action_path }}/../../contractgate_hooks/validate.py" \
          --dir "${{ inputs.path }}" \
          "${extra[@]}"
