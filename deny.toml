[advisories]
# Deny crates with known CVEs or unmaintained status.
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # RUSTSEC-2023-0071 — RSA "Marvin Attack" timing sidechannel. No fixed
    # `rsa` release exists. NOT exploitable in DataContractGate:
    #   * `rsa` is pulled ONLY transitively by jsonwebtoken's `rust_crypto`
    #     backend (cargo tree -i rsa → jsonwebtoken → contractgate).
    #   * We only *verify* Supabase RS256/ES256 JWTs with the public JWKS key
    #     (src/jwt_auth.rs: decode + DecodingKey::from_jwk). We never hold an
    #     RSA private key or perform RSA decryption — the only operation whose
    #     timing the attack can leak.
    # `rust_crypto` is retained deliberately. Do NOT "fix" this by switching
    # jsonwebtoken to `aws_lc_rs`: that reintroduces the 2026-07-14 prod
    # CryptoProvider panic (two rustls providers, no install_default in-tree →
    # SIGABRT → 502; 2026-07-14 incident).
    "RUSTSEC-2023-0071",
    # RUSTSEC-2024-0449 — `unsafe-libyaml` is unmaintained. Not a known
    # vulnerability, and there is no patched release. `serde_yaml` 0.9 is
    # the only crate that pulls it in. It parses contract YAML, including
    # YAML submitted through the API. Mapping keys stay `Value`s, so a
    # non-string key remains a number or a bool, and parse errors name
    # the line callers already surface. The 0.0.x `noyalib` candidate
    # stringifies those keys and changes the error text. Ignored until a
    # maintained replacement matches that behavior.
    "RUSTSEC-2024-0449",
    # RUSTSEC-2026-0387 — `crypto-bigint` 0.5.5 timing variability.
    # Fixed only in >=0.7.6; 0.5.5 is the last 0.5 release. Pulled only
    # through jsonwebtoken's `rust_crypto` feature (p256/p384 0.13 →
    # elliptic-curve 0.13). jsonwebtoken 11 still requires p256 ^0.13.2.
    # Keep `rust_crypto`: the alternative backend panics on CryptoProvider
    # (see the jsonwebtoken note in Cargo.toml). Revisit when jsonwebtoken
    # moves to elliptic-curve 0.14.
    "RUSTSEC-2026-0387",
]

[bans]
# Warn on duplicates — don't fail the build.  The duplicates in this tree
# (base64, getrandom, hashbrown, rand_core, tower, tower-http, etc.) are all
# transitive conflicts between axum 0.7, axum-test 20, sqlx 0.8, and reqwest
# 0.12 pulling different major versions of shared crates.  None of them affect
# correctness or introduce CVEs; they're normal Rust ecosystem churn.
multiple-versions = "warn"
wildcards = "allow"
highlight = "simplest-path"

# Known benign duplicates — allow explicitly so future duplicates still warn.
[[bans.skip]]
name = "base64"

[[bans.skip]]
name = "getrandom"

[[bans.skip]]
name = "hashbrown"

[[bans.skip]]
name = "rand_core"

[[bans.skip]]
name = "redox_syscall"

[[bans.skip]]
name = "tower-http"

[[bans.skip]]
name = "webpki-roots"

[[bans.skip]]
name = "windows-sys"

[[bans.skip]]
name = "windows-targets"

[[bans.skip]]
name = "windows_aarch64_gnullvm"

[[bans.skip]]
name = "windows_aarch64_msvc"

[[bans.skip]]
name = "windows_x86_64_gnullvm"

[[bans.skip]]
name = "windows_x86_64_msvc"

[licenses]
# Enforced in CI: `cargo deny check advisories bans sources licenses`
# and the weekly license workflow.
# A crate licensed "MIT OR …" is accepted, because MIT can be selected.
# "MIT OR Apache-2.0" is not an allow-list entry, and Apache-2.0 is not either.
# Crates that still cannot be used under an allowed license are named below.
# The wider diligence inventory in about.toml is separate.
# See docs/LICENSE-EXCEPTIONS.md.
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
]

# ICU4X and the Unicode identifier tables. The character data is Unicode-3.0.
[[licenses.exceptions]]
crate = "icu_collections"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "icu_locale_core"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "icu_normalizer"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "icu_normalizer_data"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "icu_properties"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "icu_properties_data"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "icu_provider"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "litemap"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "potential_utf"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "tinystr"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "unicode-ident"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "writeable"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "yoke"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "yoke-derive"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "zerofrom"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "zerofrom-derive"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "zerotrie"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "zerovec"
allow = ["Unicode-3.0"]

[[licenses.exceptions]]
crate = "zerovec-derive"
allow = ["Unicode-3.0"]

# Prometheus scrape endpoint. 0.18.3 is MIT AND Apache-2.0.
[[licenses.exceptions]]
crate = "metrics-exporter-prometheus"
allow = ["MIT", "Apache-2.0"]

# rustls ring backend, pulled by reqwest and sqlx.
# Apache-2.0 AND ISC: ISC is allowed globally, Apache-2.0 is not.
[[licenses.exceptions]]
crate = "ring"
allow = ["Apache-2.0", "ISC"]

# Float formatting inside csv, serde_urlencoded, and serde_yaml.
[[licenses.exceptions]]
crate = "ryu"
allow = ["Apache-2.0", "BSL-1.0"]

# hashbrown's hasher.
[[licenses.exceptions]]
crate = "foldhash"
allow = ["Zlib"]

# DDSketch histograms for the Prometheus exporter.
[[licenses.exceptions]]
crate = "sketches-ddsketch"
allow = ["Apache-2.0"]

# axum / tower / reqwest task wrapper. No MIT release on crates.io.
[[licenses.exceptions]]
crate = "sync_wrapper"
allow = ["Apache-2.0"]

# Bundled Mozilla CA set used by reqwest's rustls-tls and sqlx's rustls feature.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[sources]
# Only allow crates from crates.io.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
