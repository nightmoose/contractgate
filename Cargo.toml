[package]
name = "contractgate"
version = "0.4.1"
edition = "2021"
description = "High-performance semantic contract enforcement gateway (Patent Pending)"
authors = ["DataContractGate Team"]
license = "MIT"

[lib]
name = "contractgate"
path = "src/lib.rs"

[[bin]]
name = "contractgate-server"
path = "src/main.rs"

[[bin]]
name = "contractgate"
path = "src/bin/contractgate.rs"

# Volume / speed demo binary — Kafka-backed end-to-end pipeline with a live
# HTML dashboard.  See `demo/README.md` for setup and usage.
#
# Gated behind the `demo` feature because the Kafka client is optional.
# Keeping it off by default means `cargo check` / `cargo build` / `cargo test`
# work on any host that has Rust installed, with no Kafka toolchain.  Build
# the demo explicitly with `cargo build --features demo --bin demo`.
[[bin]]
name = "demo"
path = "src/bin/demo.rs"
required-features = ["demo"]

[[bin]]
name = "demo-seeder"
path = "src/bin/demo-seeder.rs"

# In-process validation hot path. No server, database, or extra features.
# Documented command and how to read the output: ops/bench/README.md.
[[bin]]
name = "contractgate-bench"
path = "ops/bench/main.rs"

[features]
# Default build is lean: just the library + main binary.  The `demo` feature
# pulls in the Kafka client and enables the demo binary.  See the
# `[[bin]] name = "demo"` stanza above for rationale.
#
# The `scaffold` feature enables live Kafka topic sampling for `cg scaffold
# <topic>`.  The `--from-file` scaffold path works without this feature.
default = []
demo = ["dep:confluent-kafka"]
scaffold = ["dep:confluent-kafka"]
# kafka-ingress: platform-side consumer pool for RFC-025.
# Not in default so `cargo check` / `cargo test` stay free of the Kafka client.
kafka-ingress = ["dep:confluent-kafka", "aes-gcm"]

# kinesis-ingress: platform-side consumer loop for RFC-026.
# Pure-Rust AWS SDK crates — no system deps beyond tokio.
# Not in default so `cargo check` / `cargo test` work on any host.
kinesis-ingress = ["dep:aws-sdk-kinesis", "dep:aws-sdk-iam", "dep:aws-config", "aes-gcm"]

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "timeout", "limit"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Contract YAML, including documents submitted through the API.
# Pulls unmaintained unsafe-libyaml (RUSTSEC-2024-0449). There is no
# patched release and the advisory is not a vulnerability. Ignored in
# deny.toml and .cargo/audit.toml until a maintained parser matches
# this crate's mapping keys and error text.
serde_yaml = "0.9"

# Validation
regex = "1"

# PII transforms (RFC-004): HMAC-256 for `kind: hash`, seeded StdRng
# for `mask: format_preserving`.  Pure-Rust, no system deps — portable
# across CI + sandbox builds.
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
base64 = "0.22"
rand = { version = "0.8", features = ["small_rng"] }

# Data-parallel batch validation (RFC-001).  Used by the ingest handler to
# fan out a batch of events across CPU cores while keeping the tokio reactor
# free (the parallel stage runs inside `spawn_blocking`).
rayon = "1"

# Concurrent hashmap for per-key rate-limit buckets (RFC-021).  Lock-free
# reads; no RwLock wrapping needed.
dashmap = "6"

# IDs & time
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Database
#
# rustls (not native-tls) as the TLS backend — avoids a system OpenSSL
# dependency at build time, which makes CI + sandbox builds portable and
# removes the "need libssl-dev before `cargo check` will run" paper cut.
# rustls is a pure-Rust TLS implementation and is fully compatible with
# Postgres over TLS.
#
# default-features is off so `any` and `migrate` (unused here) stay off.
# chrono, uuid, and json are enabled on `sqlx-postgres` below, not on
# `sqlx`. Those `sqlx` features are weak dependencies on sqlx-sqlite
# (`sqlx-sqlite?/chrono`, and the same for uuid and json). Cargo still
# records that crate in Cargo.lock (rust-lang/cargo#10801), which is how
# libsqlite3-sys 0.30.1 and RUSTSEC-2026-0459 entered the lockfile. sqlx
# 0.9.0 still requires libsqlite3-sys <0.38, so a version bump does not
# clear the advisory. This process only opens Postgres.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
] }
# Feature unification only; nothing imports this crate directly. Enables
# chrono, uuid, and json decoding on the sqlx-postgres package `sqlx`
# already depends on.
sqlx-postgres = { version = "0.8", features = ["chrono", "uuid", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Config / CLI
dotenvy = "0.15"
clap = { version = "4", features = ["derive", "env"] }

# CLI HTTP client — blocking reqwest keeps the CLI single-threaded (no tokio
# runtime needed in the CLI binary).  rustls avoids a system OpenSSL dep,
# matching the gateway's TLS approach.
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }

# Glob pattern matching for the `validate` and `push` subcommands when walking
# the contracts directory.  Pure-Rust, no system deps.
glob = "0.3"

# CSV parsing for contract inference (RFC-035).  Pure-Rust, no system deps.
csv = "1.3"

# Temporary files used by the scaffold HTTP handler to bridge the async
# request body into the synchronous scaffold_from_file() call path.
tempfile = "3"

# Metrics / perf
once_cell = "1"
hdrhistogram = "7"

# Observability (RFC-016): Prometheus metrics exposition.
# metrics 0.24 with the exporter's http-listener feature.
# 0.18.3 is "MIT AND Apache-2.0", allowed in deny.toml.
metrics = "0.24"
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false, features = ["http-listener"] }

# Apache Kafka client. `confluent-kafka` 1.0 is Apache-2.0, speaks the Kafka
# protocol directly, and does not bundle librdkafka or require cmake.
# Confluent Cloud is one cluster it can reach (SASL_SSL/PLAIN); Apache Kafka
# 4.0+ is the broker the integration test uses. Consumer groups use KIP-848
# (`group.protocol=consumer`), so the broker must be Kafka 4.0 or newer.
#
# `webpki-roots` turns on rustls with the aws-lc-rs provider, which compiles
# bundled C. `zstd` does the same. Neither needs a system Kafka library.
# lz4, gzip, and snappy stay so produced and fetched batches keep working.
confluent-kafka = { version = "=1.0.0", optional = true, default-features = false, features = [
    "gzip",
    "snappy",
    "lz4",
    "zstd",
    "webpki-roots",
] }

# AES-256-GCM encryption for secrets at rest (RFC-025 Confluent, RFC-026 IAM).
# Pure-Rust, no system deps. `getrandom` enables Nonce::generate() (0.11 API).
aes-gcm = { version = "0.11", optional = true, features = ["getrandom"] }

# AWS SDK for Kinesis ingress (RFC-026). Pure-Rust, no system deps.
# Gated behind `kinesis-ingress` feature — not compiled in default builds.
#
# default-features = false + only `default-https-client` (not the legacy
# `rustls` feature): AWS SDK defaults still enable `rustls` →
# `aws-smithy-runtime/tls-rustls` → hyper-rustls 0.24 / rustls 0.21 /
# rustls-webpki 0.101.7 (Dependabot alerts #2/#3/#5). The modern path uses
# rustls 0.23 + rustls-webpki ≥ 0.103.13 via `default-https-client`.
aws-sdk-kinesis = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-iam = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-config = { version = "1", optional = true, default-features = false, features = ["rt-tokio", "default-https-client", "credentials-process", "sso"] }
bytes = "1.11.1"
# Already pulled in by axum. Named here so the public-read cache can buffer
# a response body (`BodyExt::collect`) without relying on a private re-export.
http-body-util = "0.1"

# RFC-039: Supabase JWT verification for dashboard browser sessions.
# `use_pem` — PEM decoding for JWKS keys.
# `rust_crypto` — pure-Rust crypto backend required by jsonwebtoken 10.
# Without it, the first Bearer JWT verify panics:
#   "Could not automatically determine the process-level CryptoProvider"
# which SIGABRTs the process → Fly crash-loop → 502 (browser reports as CORS).
jsonwebtoken = { version = "10", features = ["use_pem", "rust_crypto"] }

# RFC-052: lock-free atomic swap for the live JWKS key set so the background
# refresh task can replace it without blocking request handlers.
arc-swap = "1"

[dev-dependencies]
axum-test = "21"
tokio-test = "0.4"
serde_json = "1"
# Integration tests for v1 ingest (RFC-021) — same flags as the main reqwest dep.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
uuid = { version = "1", features = ["v4"] }
# Property-based tests for scaffold profiler + merge algorithm (RFC-024).
proptest = "1"
# Official ODCS JSON Schema check in tests (odcs_strict_tests). Pinned to 0.20.
jsonschema = { version = "0.20", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
