version: "1.0"
name: checkout_orders
description: Source contract used only to generate the sample checkout CSV. Not the draft the review infers.
ontology:
  entities:
    - name: order_id
      type: string
      required: true
      pattern: "^ORD-[0-9]{6}$"
    - name: customer_email
      type: string
      required: true
      format: email
      max_length: 40
    - name: amount_usd
      type: number
      required: true
      min: 0.5
      max: 999.99
    - name: status
      type: string
      required: true
      enum: ["pending", "paid", "shipped", "delivered", "cancelled"]
    - name: created_at
      type: date
      required: true
    - name: country
      type: string
      required: true
      pattern: "^[A-Z]{2}$"
