apiVersion: v3.2.0
kind: DataContract
id: orders-contract
version: 1.0.0
status: active
name: Orders
schema:
  - name: orders
    logicalType: object
    properties:
      - name: order_id
        logicalType: string
        required: true
        unique: true
        logicalTypeOptions:
          pattern: "^ORD-[0-9]{6}$"
      - name: customer_email
        logicalType: string
        logicalTypeOptions:
          format: email
      - name: quantity
        logicalType: integer
        required: true
        logicalTypeOptions:
          minimum: 1
          maximum: 999
      - name: status
        logicalType: string
        enum:
          - value: open
          - value: shipped
          - value: cancelled
      - name: order_date
        logicalType: date
        required: true
        logicalTypeOptions:
          format: yyyy-MM-dd
    quality:
      - metric: rowCount
        mustBeGreaterThan: 0
