# Copy to your repo as .github/workflows/contractgate.yml
#
# Validates every YAML file under contracts/ on PRs and pushes.
# Local compile only — no API key, no network, no CLI tarball.
#
# Pin the action to a commit SHA in production instead of @main.

name: contractgate

on:
  pull_request:
    paths:
      - "contracts/**"
  push:
    branches:
      - main
    paths:
      - "contracts/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nightmoose/contractgate/actions/validate@main
        with:
          path: contracts
